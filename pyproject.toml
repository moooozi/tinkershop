[project]
name = "tinkershop"
version = "0.1.0"
description = "Local MCP toolkit providing additional tools for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Mosi" },
]
dependencies = [
    "mcp[cli]>=1.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
tinkershop = "tinkershop.server:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific (mutable defaults, etc.)
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie (duplicate code, needless pass)
    "PTH",  # flake8-use-pathlib (Path over os.path)
    "DTZ",  # flake8-datetimez
    "G",    # flake8-logging-format
    "TRY",  # tryceratops (exception-handling antipatterns)
    "ASYNC", # flake8-async
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins (shadowing builtins)
    "ERA",  # flake8-eradicate (commented-out code)
    "FURB", # refurb (modernization hints)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B008",     # function call in default argument (pytest fixtures)
    "S101",     # assert usage — fine in tests
    "S105",     # hardcoded password string — fine in test fakes
    "S106",     # hardcoded password — same
    "ARG",      # unused function arguments — fine in test dummies
    "PLR2004",  # magic value used in comparison — fine in tests
    "FBT",      # boolean trap — fine in test fixtures
    "DTZ",      # datetime without tzinfo — fine in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
