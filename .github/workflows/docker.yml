name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build and export OCI tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=/tmp/oci-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

      - name: Upload OCI tarball
        uses: actions/upload-artifact@v7
        with:
          name: oci-${{ matrix.arch }}
          path: /tmp/oci-${{ matrix.arch }}.tar
          retention-days: 1

  merge:
    name: Combine and push multi-arch
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download amd64 tarball
        uses: actions/download-artifact@v7
        with:
          name: oci-amd64
          path: /tmp/oci-amd64

      - name: Download arm64 tarball
        uses: actions/download-artifact@v7
        with:
          name: oci-arm64
          path: /tmp/oci-arm64

      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Combine OCI layouts and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          COMBINED=/tmp/combined
          rm -rf "$COMBINED"
          mkdir -p "$COMBINED/blobs/sha256"

          for ARCH in amd64 arm64; do
            mkdir -p /tmp/$ARCH
            tar -xf /tmp/oci-$ARCH/oci-$ARCH.tar -C /tmp/$ARCH
          done

          python3 - "$COMBINED" <<'PY'
          import json, os, sys
          combined_dir = sys.argv[1]
          manifests = []
          for arch in ("amd64", "arm64"):
              idx = json.load(open(f"/tmp/{arch}/index.json"))
              for m in idx["manifests"]:
                  manifests.append(m)
                  digest = m["digest"].split(":", 1)[1]
                  src = f"/tmp/{arch}/blobs/sha256/{digest}"
                  dst = f"{combined_dir}/blobs/sha256/{digest}"
                  if not os.path.exists(dst):
                      os.link(src, dst)
          index = {
              "schemaVersion": 2,
              "mediaType": "application/vnd.oci.image.index.v1+json",
              "manifests": manifests,
          }
          with open(f"{combined_dir}/oci-layout", "w") as f:
              f.write('{"imageLayoutVersion":"1.0.0"}')
          with open(f"{combined_dir}/index.json", "w") as f:
              json.dump(index, f, indent=2)
          print(json.dumps(index, indent=2))
          PY

          for TAG in $TAGS; do
            echo "Pushing $TAG"
            skopeo copy --multi-arch all "oci:$COMBINED" "docker://$TAG"
          done